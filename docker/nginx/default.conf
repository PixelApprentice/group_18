server {
  listen 80;
  server_name localhost;
  # Use Docker's internal resolver so hostnames can be resolved at runtime.
  # This allows running nginx without all backends present (labs-only mode).
  resolver 127.0.0.11 valid=30s ipv6=off;

  # avoid proxying browser favicon requests to upstreams which may cause 502s
  location = /favicon.ico {
    add_header Cache-Control "public, max-age=86400";
    return 204;
  }

  # Proxy API to Nest (use runtime resolution so nginx can start even if 'nest' is absent)
  location /api/ {
    set $nest_upstream "nest:3000";
    proxy_pass http://$nest_upstream/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  # Proxy labs
  # canonicalize requests without trailing slash -> redirect to trailing-slash path
  location = /lab/sql-injection {
    return 301 /lab/sql-injection/;
  }
  location /lab/sql-injection/ {
    set $lab_up "lab_sql_injection:3001";
    # remove the /lab/sql-injection/ prefix so the upstream sees paths like /search
    rewrite ^/lab/sql-injection/(.*)$ /$1 break;
    proxy_pass http://$lab_up/$1$is_args$args;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location = /lab/xss-stored {
    return 301 /lab/xss-stored/;
  }
  location /lab/xss-stored/ {
    set $lab_up "lab_xss_stored:3002";
    # strip the /lab/xss-stored/ prefix so upstream receives /comment or /
    rewrite ^/lab/xss-stored/(.*)$ /$1 break;
    proxy_pass http://$lab_up/$1$is_args$args;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location = /lab/broken-auth {
    return 301 /lab/broken-auth/;
  }
  location /lab/broken-auth/ {
    set $lab_up "lab_broken_auth:3003";
    # strip prefix so upstream receives /login, /logout, /
    rewrite ^/lab/broken-auth/(.*)$ /$1 break;
    proxy_pass http://$lab_up/$1$is_args$args;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location = /lab/idor {
    return 301 /lab/idor/;
  }
  location /lab/idor/ {
    set $lab_up "lab_idor:3004";
    # strip prefix so upstream receives /note/1 etc
    rewrite ^/lab/idor/(.*)$ /$1 break;
    proxy_pass http://$lab_up/$1$is_args$args;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  # fallback (runtime-resolved)
  location / {
    set $nest_upstream "nest:3000";
    proxy_pass http://$nest_upstream/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }
}
